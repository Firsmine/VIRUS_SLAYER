<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virus Slayer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <aside class="hud">
        <h1 class="gameTitle">Virus Slayer</h1>
        <div class="stats">
          <p>Time: <span id="timeDisplay">00:00</span></p>
          <p>Score: <span id="scoreDisplay">0</span></p>
          <p>Fail: <span id="failDisplay">0</span></p>
          <p>Player: <span id="playerDisplay">Unknown</span></p>
        </div>
        <div class="controls">
          <button id="btnRestartHud" class="btn secondary">Restart</button>
          <button id="btnQuit" class="btn danger">Quit</button>
        </div>
      </aside>

      <section class="gameBoard">
        <!-- area deteksi tabrakan -->
        <div class="dangerArea"></div>
        <!-- border pemisah -->
        <div class="borderLine"></div>

        <!-- 4 jalur -->
        <div class="lanesContainer">
          <div class="lane" data-lane="0">
            <div class="beam"></div>
            <div class="keycap">D</div>
          </div>
          <div class="lane" data-lane="1">
            <div class="beam"></div>
            <div class="keycap">F</div>
          </div>
          <div class="lane" data-lane="2">
            <div class="beam"></div>
            <div class="keycap">J</div>
          </div>
          <div class="lane" data-lane="3">
            <div class="beam"></div>
            <div class="keycap">K</div>
          </div>
        </div>

        <!-- tempat virus -->
        <div id="virusContainer"></div>
      </section>

      <!-- overlays modal -->
      <div id="modalOverlay" class="modalOverlay">
        <!--Instruction Modal -->
        <div id="modalInstruction" class="modalContent active">
          <img src="assets/icon.png" alt="Game Icons" class="modalIcon" />
          <h2>Instruction Virus Slayer</h2>
          <ol class="instructionList">
            <li>Input Username and click Play</li>
            <li>Destroy Virus with <strong>D F J K</strong> Key</li>
            <li>Reach High Score</li>
            <li>Enjoy</li>
          </ol>
          <input type="text" id="usernameInput" placeholder="Input Username" />
          <button id="btnPlay" class="btn primary" disabled>Play</button>
        </div>

        <!-- Countdown Modal -->
        <div id="modalCountdown" class="modalContent hidden">
          <h1 id="countdownText" class="countdownText">3</h1>
        </div>

        <!-- Pause Modal -->
        <div id="modalPause" class="modalContent hidden">
          <h2>Paused</h2>
          <div class="modalActions">
            <button id="btnContinue" class="btn primary">Continue</button>
            <button id="btnRestartPause" class="btn danger">Restart</button>
          </div>
        </div>

        <!-- Game Over Modal -->
        <div id="modalGameOver" class="modalContent hidden">
          <h2>Game Over</h2>
          <div class="finalStats">
            <p>Time: <span id="finalTime">00:00</span></p>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Player: <span id="finalPlayer">Unknown</span></p>
          </div>
          <button id="btnRestartGameOver" class="btn danger">Restart</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
